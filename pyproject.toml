[project]
name = "careerrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abeermorshdy", email = "byralmrshdy41@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "dvc>=3.67.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
careerrag = "careerrag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
